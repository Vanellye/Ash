app = "eria-dimensional-api"
primary_region = "ord"

[build]
  dockerfile = "dimensional-api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/eria.sqlite"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "15s"
  timeout = "3s"
  grace_period = "20s"

[[mounts]]
  source = "eria_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[deploy]
  strategy = "rolling"
